services:
  postgres:
    image: postgres:16
    container_name: vaaniplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaaniplus
      POSTGRES_USER: vaaniplus
      POSTGRES_PASSWORD: vaaniplus
    ports:
      - "5432:5432"
    volumes:
      - vaaniplus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaaniplus -d vaaniplus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vaaniplus-postgres-data:
